name: Release Please

on:
  push:
    branches: [main]

# The action authenticates with RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN.
# Releases created with GITHUB_TOKEN don't trigger other workflows, so the
# custom token is what lets the release start publish.yml.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
