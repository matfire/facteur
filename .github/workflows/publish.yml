name: Publish

on:
  release:
    types: [published]

# Only the facteur package is published. Its release tags look like facteur-v1.2.3.

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN needed

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'facteur-v')
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: stage-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      # Only check and build the published package, not the website.
      - run: bunx turbo run typecheck test build --filter=@matfire/facteur
      - run: npm stage publish --access public --provenance
        working-directory: packages/facteur
