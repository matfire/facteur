<!doctype html>
<!-- Template for the PNG app icons. Rendered square at 180, 192 and 512 px by generate.sh. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #08090a;
      }
      body {
        display: grid;
        place-items: center;
      }
      svg {
        width: 64vw;
        height: 64vw;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 16 16">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f7f8f8" />
          <stop offset="1" stop-color="#8a8f98" />
        </linearGradient>
      </defs>
      <rect width="16" height="16" rx="4" fill="url(#g)" />
      <path
        d="M3.5 5.5 8 8.75l4.5-3.25"
        fill="none"
        stroke="#08090a"
        stroke-width="1.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </body>
</html>
